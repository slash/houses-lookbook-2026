function tcolor(f){ // blue(cold)->green->yellow->orange->red(hot), 55..100F
 const t=Math.max(0,Math.min(1,(f-55)/45));
 const stops=[[100,150,235],[110,200,170],[240,215,110],[235,150,70],[210,70,60]];
 const i=Math.min(3,Math.floor(t*4)),fr=t*4-i;
 const a=stops[i],b=stops[i+1];const c=a.map((v,k)=>Math.round(v+(b[k]-v)*fr));
 return `rgb(${c[0]},${c[1]},${c[2]})`;}
async function load(){
 document.getElementById('status').textContent='fetching Open-Meteo…';
 const B=100, out=[];
 for(let i=0;i<LOCS.length;i+=B){
  const chunk=LOCS.slice(i,i+B);
  const la=chunk.map(x=>x.la).join(','),lo=chunk.map(x=>x.lo).join(',');
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,apparent_temperature,relative_humidity_2m&temperature_unit=fahrenheit`;
  try{const r=await fetch(u);const d=await r.json();const arr=Array.isArray(d)?d:[d];
   arr.forEach((o,j)=>{const c=o.current||{};out.push({...chunk[j],temp:c.temperature_2m,feels:c.apparent_temperature,rh:c.relative_humidity_2m});});
  }catch(e){document.getElementById('status').textContent='fetch error: '+e;return;}
 }
 rows=out; const t=new Date();
 document.getElementById('status').textContent='updated '+t.toLocaleTimeString()+' · Open-Meteo · auto-refresh 10min';
 render();
}
function render(){
 const showV=document.getElementById('show').value, sortV=document.getElementById('sort').value;
 let r=rows.filter(x=>x.temp!=null);
 if(showV!=='all') r=r.filter(x=>x.kind===showV);
 if(sortV==='temp') r.sort((a,b)=>a.temp-b.temp);
 else if(sortV==='hot') r.sort((a,b)=>b.temp-a.temp);
 else if(sortV==='name') r.sort((a,b)=>a.name.localeCompare(b.name));
 else r.sort((a,b)=>(a.parent+a.name).localeCompare(b.parent+b.name));
 const tb=document.querySelector('#t tbody');
 tb.innerHTML=r.map(x=>`<tr class="${x.kind==='sub'?'sub':''}"><td>${x.kind==='sub'?'· ':''}${x.name}</td><td class="mut">${x.kind==='sub'?x.parent:x.parent}</td>
  <td class="t"><span class="pill" style="background:${tcolor(x.temp)}">${Math.round(x.temp)}°</span></td>
  <td class="mut">${Math.round(x.feels)}°</td><td class="mut">${x.rh}%</td></tr>`).join('');
}
document.getElementById('refresh').onclick=load;
document.getElementById('show').onchange=render;
document.getElementById('sort').onchange=render;
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{document.getElementById('sort').value=({name:'name',parent:'parent',temp:'temp',feels:'hot',rh:'hot'})[th.dataset.k]||'temp';render();});
load(); setInterval(load,600000);
</script></body></html>
